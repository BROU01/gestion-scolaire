<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion — Gestion Scolaire</title>
  <style>
    /* ============================================
       LOGIN — Néo-Brutaliste + Glassmorphism
       Palette : Blanc, Vert #16A34A, Noir
       ============================================ */

    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap');

    *, *::before, *::after { margin:0; padding:0; box-sizing:border-box; }
    html { font-size:16px; scroll-behavior:smooth; }
    body {
      font-family: 'Manrope', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      background: #0a0f0a;
    }

    /* --- Heroicons sizing --- */
    .heroicon { width:20px; height:20px; flex-shrink:0; stroke:currentColor; stroke-width:1.5; fill:none; stroke-linecap:round; stroke-linejoin:round; }
    .heroicon-sm { width:16px; height:16px; }
    .heroicon-lg { width:24px; height:24px; }
    .heroicon-xl { width:32px; height:32px; }

    .login-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      background:
        linear-gradient(135deg, rgba(10, 15, 10, 0.85) 0%, rgba(10, 15, 10, 0.70) 100%),
        url('images/login-page-background.webp') no-repeat center center fixed;
      background-size: cover;
    }

    /* Fallback si l'image n'existe pas — gradient vert foncé */
    @supports (background: linear-gradient(135deg, #0a1a0a, #0f2a0f)) {
      .login-page {
        background:
          linear-gradient(135deg, rgba(10, 26, 10, 0.88) 0%, rgba(15, 42, 15, 0.75) 100%),
          url('images/login-page-background.webp') no-repeat center center fixed;
        background-size: cover, cover;
      }
    }

    /* Canvas Matrix */
    #matrixCanvas {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    /* --- Conteneur Glassmorphism Néo-Brutaliste --- */
    .login-container {
      background: rgba(12, 20, 14, 0.35);
      backdrop-filter: blur(28px) saturate(1.2);
      -webkit-backdrop-filter: blur(28px) saturate(1.2);
      border: 2px solid #000000;
      width: 100%;
      max-width: 420px;
      padding: 44px 36px 36px;
      position: relative;
      z-index: 10;
      animation: scaleIn 0.4s ease-out both;
      box-shadow: 5px 5px 0 #000000;
    }

    @keyframes scaleIn {
      from { opacity: 0; transform: scale(0.95); }
      to { opacity: 1; transform: scale(1); }
    }

    /* --- Logo & Branding --- */
    .login-logo {
      text-align: center;
      margin-bottom: 36px;
    }

    .login-logo .logo-icon {
      width: 60px;
      height: 60px;
      background: rgba(22, 163, 74, 0.2);
      border: 2px solid #000000;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
      backdrop-filter: blur(8px);
    }

    .login-logo .logo-icon .heroicon {
      width: 30px;
      height: 30px;
      color: #4ade80;
    }

    .login-logo h1 {
      font-size: 1.5rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.03em;
    }

    .login-logo #loginRoleLabel {
      color: rgba(255, 255, 255, 0.45);
      font-size: 0.8125rem;
      margin-top: 6px;
      font-weight: 600;
    }

    /* --- Formulaires --- */
    .form-group {
      margin-bottom: 22px;
      position: relative;
    }

    .form-group label {
      display: block;
      font-size: 0.75rem;
      font-weight: 700;
      color: rgba(255, 255, 255, 0.7);
      margin-bottom: 8px;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }

    .form-control {
      width: 100%;
      padding: 12px 16px;
      border: 2px solid #000000;
      font-size: 0.9375rem;
      color: #ffffff;
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      transition: all 0.2s ease;
      outline: none;
    }

    .form-control::placeholder { color: rgba(255, 255, 255, 0.25); }
    .form-control:focus {
      border-color: #16A34A;
      background: rgba(255, 255, 255, 0.1);
      box-shadow: 3px 3px 0 #000000;
    }
    .form-control.error {
      border-color: #DC2626;
      box-shadow: 3px 3px 0 rgba(220, 38, 38, 0.3);
    }

    .form-error {
      color: #DC2626;
      font-size: 0.75rem;
      margin-top: 6px;
      display: none;
      align-items: center;
      gap: 6px;
    }
    .form-error.visible { display: flex; animation: fadeIn 0.2s ease-out; }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    /* --- Bouton néo-brutaliste --- */
    .btn-glass {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      width: 100%;
      padding: 14px 24px;
      border: 2px solid #000000;
      font-size: 0.9375rem;
      font-weight: 800;
      color: #ffffff;
      cursor: pointer;
      transition: all 0.12s ease;
      background: #16A34A;
      box-shadow: 4px 4px 0 #000000;
    }

    .btn-glass:hover {
      background: #15803D;
      transform: translate(-2px, -2px);
      box-shadow: 6px 6px 0 #000000;
    }

    .btn-glass:active {
      transform: translate(1px, 1px);
      box-shadow: none;
    }

    .btn-glass:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    .secure-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 0.6875rem;
      color: rgba(255, 255, 255, 0.25);
      margin-top: 24px;
      text-align: center;
      justify-content: center;
      width: 100%;
    }
    .secure-badge .heroicon { width:12px; height:12px; }

    @keyframes spin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

    @media (max-width: 480px) {
      .login-container { margin:16px; padding:32px 24px 28px; }
      .login-logo .logo-icon { width:52px; height:52px; }
      .login-logo h1 { font-size:1.25rem; }
    }
  </style>
</head>
<body>

  <!-- Canvas Matrix Effect -->
  <canvas id="matrixCanvas"></canvas>

  <!-- Conteneur Glassmorphism -->
  <div class="login-page">
    <div class="login-container">
      <div class="login-logo">
        <div class="logo-icon">
          <svg class="heroicon" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4.26 10.147a60.438 60.438 0 0 0-.491 6.347A48.62 48.62 0 0 1 12 20.904a48.62 48.62 0 0 1 8.232-4.41 60.46 60.46 0 0 0-.491-6.347m-15.482 0a50.636 50.636 0 0 0-2.658-.813A59.906 59.906 0 0 1 12 3.493a59.903 59.903 0 0 1 10.399 5.84c-.896.248-1.783.52-2.658.814m-15.482 0A50.717 50.717 0 0 1 12 13.489a50.702 50.702 0 0 1 7.74-3.342M6.75 15a.75.75 0 1 0 0-1.5.75.75 0 0 0 0 1.5Zm0 0v-3.675A55.378 55.378 0 0 1 12 8.443m-7.007 11.55A5.981 5.981 0 0 0 6.75 15.75v-1.5" />
          </svg>
        </div>
        <h1>Gestion Scolaire</h1>
        <p id="loginRoleLabel">Administration</p>
      </div>

      <form id="loginForm">
        <!-- Champ rôle caché — déterminé par l'URL -->
        <input type="hidden" id="loginRole" name="role" value="admin">

        <div class="form-group">
          <label for="loginEmail">Identifiant</label>
          <input type="text" id="loginEmail" class="form-control" placeholder="Votre email ou identifiant" required autocomplete="username">
          <div class="form-error" id="emailError">
            <svg class="heroicon heroicon-sm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span>Veuillez entrer un identifiant valide.</span>
          </div>
        </div>

        <div class="form-group">
          <label for="loginPassword">Mot de passe</label>
          <div style="position:relative;">
            <input type="password" id="loginPassword" class="form-control" placeholder="••••••••" required autocomplete="current-password">
          </div>
          <div class="form-error" id="passwordError">
            <svg class="heroicon heroicon-sm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 8v4"/><path d="M12 16h.01"/></svg>
            <span>Le mot de passe doit contenir au moins 6 caractères.</span>
          </div>
        </div>

        <button type="submit" class="btn-glass" id="loginBtn">
          <svg class="heroicon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg>
          <span>Se connecter</span>
        </button>

        <div class="secure-badge">
          <svg class="heroicon" width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.75 11.25 15 15 9.75m-3-7.036A11.959 11.959 0 0 1 3.598 6 11.99 11.99 0 0 0 3 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751h-.152c-3.196 0-6.1-1.248-8.25-3.285Z"/></svg>
          <span>Connexion sécurisée</span>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer"></div>

  <script>
    /* ============================================
       Matrix Rain Effect
       ============================================ */
    (function initMatrix() {
      var canvas = document.getElementById('matrixCanvas');
      if (!canvas) return;
      var ctx = canvas.getContext('2d');

      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) {
        ctx.fillStyle = '#0a1a0a';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        return;
      }

      function resize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      }
      resize();
      window.addEventListener('resize', resize);

      var chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%&*(){}[]|/<>~^';
      var fontSize = 14;
      var columns = Math.floor(canvas.width / fontSize);
      var drops = [];
      for (var i = 0; i < columns; i++) { drops[i] = Math.random() * -100; }

      function draw() {
        ctx.fillStyle = 'rgba(10, 15, 10, 0.03)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.font = fontSize + 'px monospace';

        for (var i = 0; i < drops.length; i++) {
          var text = chars.charAt(Math.floor(Math.random() * chars.length));
          var x = i * fontSize;
          var y = drops[i] * fontSize;
          var brightness = Math.random();
          if (brightness > 0.97) { ctx.fillStyle = 'rgba(255, 255, 255, 0.6)'; }
          else if (brightness > 0.85) { ctx.fillStyle = 'rgba(74, 222, 128, 0.5)'; }
          else { ctx.fillStyle = 'rgba(74, 222, 128, 0.15)'; }
          ctx.fillText(text, x, y);
          if (y > canvas.height && Math.random() > 0.975) { drops[i] = 0; }
          drops[i]++;
        }
      }
      setInterval(draw, 50);
    })();

    /* ============================================
       Login Logic — Per-role URL detection
       ============================================ */
    document.addEventListener('DOMContentLoaded', function() {
      var form = document.getElementById('loginForm');
      var roleInput = document.getElementById('loginRole');
      var emailInput = document.getElementById('loginEmail');
      var passwordInput = document.getElementById('loginPassword');
      var emailError = document.getElementById('emailError');
      var passwordError = document.getElementById('passwordError');
      var loginBtn = document.getElementById('loginBtn');
      var roleLabel = document.getElementById('loginRoleLabel');

      var API_BASE = '';

      /* Déterminer le rôle depuis l'URL */
      var path = window.location.pathname;
      var roleMap = {
        '/admin/login': 'admin',
        '/enseignant/login': 'teacher',
        '/prof/login': 'teacher',
        '/etudiant/login': 'student',
        '/eleve/login': 'student',
        '/parent/login': 'parent'
      };

      /* Fallback: détection par paramètre query ?role=xxx */
      var params = new URLSearchParams(window.location.search);
      var detectedRole = null;

      for (var p in roleMap) {
        if (path === p || path.endsWith(p)) {
          detectedRole = roleMap[p];
          break;
        }
      }

      if (!detectedRole && params.get('role')) {
        detectedRole = params.get('role');
      }

      /* Dernier fallback: depuis login.html → admin par défaut */
      if (!detectedRole) {
        /* Vérifier les redirections possibles */
        if (path.indexOf('admin') !== -1) detectedRole = 'admin';
        else if (path.indexOf('teacher') !== -1 || path.indexOf('enseignant') !== -1 || path.indexOf('prof') !== -1) detectedRole = 'teacher';
        else if (path.indexOf('student') !== -1 || path.indexOf('etudiant') !== -1 || path.indexOf('eleve') !== -1) detectedRole = 'student';
        else if (path.indexOf('parent') !== -1) detectedRole = 'parent';
        else detectedRole = 'admin';
      }

      roleInput.value = detectedRole;

      /* Afficher le rôle détecté */
      var roleNames = {
        admin: 'Administration',
        teacher: 'Espace Enseignant',
        student: 'Espace Étudiant',
        parent: 'Espace Parent'
      };
      roleLabel.textContent = roleNames[detectedRole] || 'Connexion';

      /* Label animations */
      document.querySelectorAll('.form-control').forEach(function(input) {
        input.addEventListener('focus', function() {
          this.closest('.form-group').querySelector('label').style.color = 'rgba(74, 222, 128, 0.9)';
        });
        input.addEventListener('blur', function() {
          this.closest('.form-group').querySelector('label').style.color = '';
        });
      });

      form.addEventListener('submit', function(e) {
        e.preventDefault();

        var email = emailInput.value.trim();
        var password = passwordInput.value;
        var role = roleInput.value;

        emailError.classList.remove('visible');
        passwordError.classList.remove('visible');
        emailInput.classList.remove('error');
        passwordInput.classList.remove('error');

        var valid = true;

        if (!email || email.length < 3) {
          emailError.classList.add('visible');
          emailInput.classList.add('error');
          valid = false;
        }

        if (!password || password.length < 6) {
          passwordError.classList.add('visible');
          passwordInput.classList.add('error');
          valid = false;
        }

        if (!valid) return;

        loginBtn.disabled = true;
        loginBtn.innerHTML = '<svg class="heroicon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation: spin 1s linear infinite;"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg> Connexion...';

        /* Appel API — avec gestion robuste des erreurs HTTP */
        fetch(API_BASE + '/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: email, password: password, role: role })
        })
        .then(function(res) {
          if (!res.ok) {
            /* Gérer les erreurs HTTP (rate limit, 500, etc.) */
            return res.json().then(function(err) {
              throw new Error(err.error || 'Erreur serveur (' + res.status + ')');
            }).catch(function(e) {
              if (e instanceof SyntaxError) throw new Error('Erreur serveur (' + res.status + '). Veuillez réessayer.');
              throw e;
            });
          }
          return res.json();
        })
        .then(function(data) {
          localStorage.setItem('ecole_session', JSON.stringify(data.user));
          localStorage.setItem('ecole_token', data.token);

          /* Stocker aussi le refresh token si présent */
          if (data.refreshToken) {
            localStorage.setItem('ecole_refresh_token', data.refreshToken);
          }

          var redir = {
            admin: '../admin/index.html',
            teacher: '../admin/index.html',
            student: '../admin/index.html',
            parent: '../admin/index.html'
          };

          showToast('Connexion réussie ! Bienvenue ' + (data.user.firstName || ''), 'success');
          setTimeout(function() {
            window.location.href = redir[role] || '../admin/index.html';
          }, 600);
        })
        .catch(function(err) {
          showToast(err.message || 'Erreur de connexion au serveur.', 'error');
          loginBtn.disabled = false;
          loginBtn.innerHTML = '<svg class="heroicon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/></svg> Se connecter';
        });
      });
    });

    /* --- Toast --- */
    function showToast(message, type) {
      var container = document.getElementById('toastContainer');
      var toast = document.createElement('div');
      toast.className = 'toast toast-' + (type || 'info');

      var icons = {
        success: '<svg class="heroicon heroicon-sm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 12.75 11.25 15 15 9.75M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Z"/></svg>',
        error: '<svg class="heroicon heroicon-sm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v3.75m9-.75a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9 3.75h.008v.008H12v-.008Z"/></svg>',
        info: '<svg class="heroicon heroicon-sm" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m11.25 11.25.041-.02a.75.75 0 0 1 1.063.852l-.708 2.836a.75.75 0 0 0 1.063.853l.041-.021M21 12a9 9 0 1 1-18 0 9 9 0 0 1 18 0Zm-9-3.75h.008v.008H12V8.25Z"/></svg>'
      };

      toast.style.cssText = 'display:flex;align-items:center;gap:10px;background:#fff;border:2px solid #000;box-shadow:4px 4px 0 #000;padding:14px 20px;min-width:300px;max-width:420px;animation:fadeIn 0.2s ease-out;border-left:4px solid ' + (type === 'success' ? '#16A34A' : type === 'error' ? '#DC2626' : '#2563EB') + ';';
      toast.innerHTML = '<span style="flex-shrink:0;">' + (icons[type] || icons.info) + '</span><span style="flex:1;font-size:0.875rem;color:#0F172A;">' + message + '</span>';
      container.appendChild(toast);

      setTimeout(function() {
        toast.style.opacity = '0';
        toast.style.transform = 'translateX(100%)';
        toast.style.transition = 'all 0.3s ease';
        setTimeout(function() { toast.remove(); }, 300);
      }, 3500);
    }
  </script>
</body>
</html>
